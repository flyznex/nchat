[package]
name = "nchat-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nchat-rs"
path = "src/main.rs"

[dependencies]
nchat-core-sys = { path = "../nchat-core-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = "0.2"
libc = "0.2"
